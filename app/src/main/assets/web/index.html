<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的应用</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0; min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .logo {
    width: 88px; height: 88px; border-radius: 24px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(56,189,248,.35);
  }
  h1 { font-size: 26px; margin-bottom: 12px; letter-spacing: 1px; }
  p  { font-size: 15px; color: #94a3b8; line-height: 1.7; max-width: 320px; }
  .hint {
    margin-top: 32px; padding: 14px 20px; border-radius: 12px;
    background: rgba(56,189,248,.1); border: 1px solid rgba(56,189,248,.25);
    font-size: 13px; color: #7dd3fc; line-height: 1.6;
  }
  .btn {
    margin-top: 24px; padding: 12px 32px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform .15s;
  }
  .btn:active { transform: scale(.96); }
  #count { color:#38bdf8; font-weight:700; }
</style>
</head>
<body>

  <div class="logo">📦</div>
  <h1>打包成功</h1>
  <p>这是你的示例页面。<br>把 <code>app/src/main/assets/web/</code> 里的文件换成你自己的网页即可。</p>

  <button class="btn" onclick="tap()">点我测试</button>

  <div class="hint">
    ✅ 本地资源可加载<br>
    ✅ JavaScript 已启用<br>
    已点击：<span id="count">0</span> 次
  </div>

<script>
  let n = 0;
  function tap() {
    n++;
    document.getElementById('count').textContent = n;
    // 测试 localStorage 是否可用
    localStorage.setItem('lastTap', Date.now());
    if (navigator.vibrate) navigator.vibrate(20);
  }
  // 读取上次记录，验证存储功能
  const last = localStorage.getItem('lastTap');
  if (last) {
    document.querySelector('.hint').innerHTML +=
      '<br>上次打开：' + new Date(Number(last)).toLocaleString('zh-CN');
  }
</script>
</body>
</html>
